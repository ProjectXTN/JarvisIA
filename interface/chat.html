<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jarvis — escrever</title>
<style>
  :root { --bg:#0e1116; --card:#161b22; --line:#262d36; --text:#e6edf3; --dim:#8b949e; --accent:#4cc2ff; --me:#1f6feb; }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; }
  body { display:flex; flex-direction:column; background:var(--bg); color:var(--text); font:15px/1.5 system-ui, "Segoe UI", sans-serif; }
  header { padding:12px 16px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px; }
  header b { font-weight:600; } header b span { color:var(--accent); }
  .dot { width:8px; height:8px; border-radius:50%; background:#3fb950; }
  .dot.off { background:#ff7b72; }
  #log { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:8px; }
  .msg { max-width:85%; padding:8px 12px; border-radius:12px; white-space:pre-wrap; word-wrap:break-word; }
  .jarvis { background:var(--card); border:1px solid var(--line); align-self:flex-start; border-bottom-left-radius:4px; }
  .pedro { background:var(--me); align-self:flex-end; border-bottom-right-radius:4px; }
  .hora { display:block; font-size:11px; color:var(--dim); margin-top:2px; }
  .pedro .hora { color:#c9d9ff; }
  form { display:flex; gap:8px; padding:12px 16px 6px; border-top:1px solid var(--line); }
  textarea { flex:1; resize:none; height:46px; max-height:160px; padding:11px 12px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--text); font:inherit; }
  textarea:focus { outline:none; border-color:var(--accent); }
  button { background:var(--accent); color:#001018; border:0; border-radius:10px; padding:0 18px; font:inherit; font-weight:600; cursor:pointer; }
  label { color:var(--dim); font-size:13px; padding:0 16px 12px; display:flex; gap:6px; align-items:center; }
  .vazio { color:var(--dim); text-align:center; margin-top:30%; }
</style>
</head>
<body>
<header><span class="dot" id="dot"></span><b>Escrever para o <span>Jarvis</span></b></header>
<div id="log"><div class="vazio" id="vazio">Escreva aqui o que você falaria. Enter envia, Shift+Enter pula linha.</div></div>
<form id="form"><textarea id="texto" placeholder="Mensagem para o Jarvis..." autofocus></textarea><button>Enviar</button></form>
<label><input type="checkbox" id="mudo"> Responder só por escrito (sem falar)</label>
<script>
const KEY = new URLSearchParams(location.search).get("k") || "";
let last = 0;
const log = document.getElementById("log"), box = document.getElementById("texto");
const mudo = document.getElementById("mudo");
mudo.checked = localStorage.getItem("jarvisMudo") === "1";
mudo.onchange = () => localStorage.setItem("jarvisMudo", mudo.checked ? "1" : "0");

function add(m) {
  document.getElementById("vazio")?.remove();
  const d = document.createElement("div");
  d.className = "msg " + (m.quem === "pedro" ? "pedro" : "jarvis");
  d.textContent = m.texto;
  const h = document.createElement("span"); h.className = "hora"; h.textContent = m.hora; d.appendChild(h);
  const atBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 80;
  log.appendChild(d);
  if (atBottom || m.quem === "pedro") log.scrollTop = log.scrollHeight;
}
async function poll() {
  try {
    const r = await fetch("/mensagens?desde=" + last, {headers: {"X-Jarvis-Key": KEY}});
    const data = await r.json();
    for (const m of data.mensagens || []) { add(m); last = m.n; }
    document.getElementById("dot").classList.remove("off");
  } catch (e) { document.getElementById("dot").classList.add("off"); }
  setTimeout(poll, 700);
}
async function send() {
  const texto = box.value.trim();
  if (!texto) return;
  box.value = ""; box.style.height = "46px";
  await fetch("/enviar", {method: "POST", headers: {"Content-Type": "application/json", "X-Jarvis-Key": KEY},
                          body: JSON.stringify({texto, so_texto: mudo.checked})});
}
document.getElementById("form").onsubmit = e => { e.preventDefault(); send(); };
box.onkeydown = e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } };
box.oninput = () => { box.style.height = "46px"; box.style.height = Math.min(box.scrollHeight, 160) + "px"; };
poll();
</script>
</body>
</html>
