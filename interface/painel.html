<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jarvis — o que eu sei</title>
<style>
  :root { --bg:#0e1116; --card:#161b22; --line:#262d36; --text:#e6edf3; --dim:#8b949e; --accent:#4cc2ff; --bad:#ff7b72; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.5 system-ui, "Segoe UI", sans-serif; background:var(--bg); color:var(--text); }
  header { padding:20px 28px 8px; display:flex; align-items:baseline; gap:16px; flex-wrap:wrap; }
  h1 { margin:0; font-size:22px; font-weight:600; }
  h1 span { color:var(--accent); }
  .dim { color:var(--dim); font-size:13px; }
  nav { display:flex; gap:6px; padding:8px 28px 0; flex-wrap:wrap; border-bottom:1px solid var(--line); }
  nav button { background:none; border:0; color:var(--dim); padding:10px 12px; cursor:pointer; font:inherit; border-bottom:2px solid transparent; }
  nav button.on { color:var(--text); border-color:var(--accent); }
  nav b { font-weight:500; color:var(--dim); font-size:12px; margin-left:4px; }
  main { padding:20px 28px 60px; max-width:1100px; }
  input[type=search] { width:100%; max-width:420px; padding:9px 12px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--text); font:inherit; margin-bottom:14px; }
  .row { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin-bottom:10px; }
  .row h3 { margin:0 0 4px; font-size:14px; font-weight:600; color:var(--accent); }
  .row p { margin:0; white-space:pre-wrap; }
  .meta { color:var(--dim); font-size:12px; margin-top:6px; display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
  .meta button { background:none; border:1px solid var(--line); color:var(--dim); border-radius:6px; padding:2px 10px; cursor:pointer; font-size:12px; }
  .meta button:hover { color:var(--text); border-color:var(--dim); }
  .meta button.del:hover { color:var(--bad); border-color:var(--bad); }
  textarea { width:100%; min-height:90px; background:var(--bg); color:var(--text); border:1px solid var(--accent); border-radius:8px; padding:8px; font:inherit; }
  #login { max-width:420px; margin:80px auto; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:24px; }
  #login input { width:100%; padding:10px; margin:12px 0; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--text); font:inherit; }
  #login button, .save { background:var(--accent); color:#001018; border:0; border-radius:8px; padding:8px 16px; font:inherit; font-weight:600; cursor:pointer; }
  .empty { color:var(--dim); padding:30px 0; }
  .err { color:var(--bad); }
</style>
</head>
<body>
<div id="login" hidden>
  <h1>Painel do <span>Jarvis</span></h1>
  <p class="dim">Cole o SECRET_TOKEN_JARVIS do seu .env. Ele fica só nesta aba do navegador.</p>
  <input id="token" type="password" autocomplete="off" placeholder="token">
  <button id="enter">Entrar</button>
  <p id="loginErr" class="err"></p>
</div>
<div id="app" hidden>
  <header><h1>O que o <span>Jarvis</span> sabe</h1><span class="dim" id="status"></span></header>
  <nav id="tabs"></nav>
  <main><input type="search" id="filter" placeholder="Filtrar..."><div id="list"></div></main>
</div>
<script>
const TABS = [
  {key:"perfil", label:"Sobre você", kind:"memorias", title:r=>r.assunto, text:r=>r.texto, meta:r=>[r.criado, r.fonte]},
  {key:"fato", label:"Pediu para guardar", kind:"memorias", title:r=>r.assunto, text:r=>r.texto, meta:r=>[r.criado]},
  {key:"aprendido", label:"Aprendido", kind:"memorias", title:r=>r.assunto, text:r=>r.texto, meta:r=>[r.criado, r.fonte]},
  {key:"opinioes", label:"Opiniões", kind:"opinioes", field:"opiniao", title:r=>r.tema, text:r=>r.opiniao, meta:r=>[r.atualizado, "Motivo: "+(r.motivo||"")]},
  {key:"curiosidades", label:"Quer estudar", kind:"curiosidades", field:"tema", title:r=>r.status, text:r=>r.tema, meta:r=>[r.origem, r.motivo, r.estudado]},
  {key:"diario", label:"Diário", kind:"diario", field:"resumo", title:r=>r.id, text:r=>r.resumo, meta:r=>[]},
  {key:"compromissos", label:"Compromissos", kind:"compromissos", field:"texto", title:r=>r.quando + (r.avisado ? " (avisado)" : ""), text:r=>r.texto, meta:r=>[]},
  {key:"contradicoes", label:"Contradições", kind:"contradicoes", field:null, title:r=>"Notas "+r.memoria_a+" × "+r.memoria_b+(r.resolvida?" (resolvida)":""), text:r=>r.explicacao, meta:r=>[]},
  {key:"documento", label:"Documentos", kind:"memorias", title:r=>r.fonte, text:r=>r.texto, meta:r=>[r.criado]},
];
let data = {}, current = "perfil";
const $ = id => document.getElementById(id);
const token = () => sessionStorage.getItem("jarvisToken") || "";

async function api(path, body) {
  const res = await fetch(path, {method: body ? "POST" : "GET",
    headers: {"Authorization": "Bearer " + token(), "Content-Type": "application/json"},
    body: body ? JSON.stringify(body) : undefined});
  if (res.status === 401) { sessionStorage.removeItem("jarvisToken"); showLogin("Token inválido."); throw new Error("401"); }
  if (!res.ok) throw new Error((await res.json()).error || res.status);
  return res.json();
}
function showLogin(msg) { $("app").hidden = true; $("login").hidden = false; $("loginErr").textContent = msg || ""; }
async function load() {
  data = await api("/api/painel");
  $("login").hidden = true; $("app").hidden = false;
  $("status").textContent = "atualizado " + new Date().toLocaleTimeString("pt-BR");
  renderTabs(); render();
}
function renderTabs() {
  $("tabs").innerHTML = "";
  for (const t of TABS) {
    const b = document.createElement("button");
    b.className = t.key === current ? "on" : "";
    b.innerHTML = t.label + "<b>" + (data[t.key] || []).length + "</b>";
    b.onclick = () => { current = t.key; renderTabs(); render(); };
    $("tabs").appendChild(b);
  }
}
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function render() {
  const tab = TABS.find(t => t.key === current), q = $("filter").value.toLowerCase();
  const rows = (data[current] || []).filter(r => !q || JSON.stringify(r).toLowerCase().includes(q));
  const list = $("list"); list.innerHTML = "";
  if (!rows.length) { list.appendChild(el("div", "empty", "Nada aqui ainda.")); return; }
  for (const r of rows) {
    const box = el("div", "row");
    box.appendChild(el("h3", null, tab.title(r) || ""));
    const p = el("p", null, tab.text(r) || ""); box.appendChild(p);
    const meta = el("div", "meta");
    for (const m of tab.meta(r)) if (m) meta.appendChild(el("span", null, m));
    if (tab.field !== null) {
      const edit = el("button", null, "Corrigir");
      edit.onclick = () => startEdit(box, p, tab, r);
      meta.appendChild(edit);
    }
    if (tab.key === "contradicoes" && !r.resolvida) {
      const ok = el("button", null, "Marcar resolvida");
      ok.onclick = () => change(tab.kind, r.id, {campo: "resolvida", valor: 1});
      meta.appendChild(ok);
    }
    const del = el("button", "del", "Apagar");
    del.onclick = () => { if (confirm("Apagar de vez?")) change(tab.kind, r.id, {acao: "apagar"}); };
    meta.appendChild(del);
    box.appendChild(meta);
    list.appendChild(box);
  }
}
function startEdit(box, p, tab, r) {
  const area = el("textarea"); area.value = tab.text(r) || "";
  const save = el("button", "save", "Salvar");
  save.onclick = () => change(tab.kind, r.id, tab.kind === "memorias"
      ? {valor: area.value, assunto: r.assunto} : {campo: tab.field, valor: area.value});
  p.replaceWith(area); area.after(save); area.focus();
}
async function change(kind, id, body) {
  try { await api("/api/painel/" + kind + "/" + encodeURIComponent(id), body); await load(); }
  catch (e) { if (e.message !== "401") $("status").textContent = "Erro: " + e.message; }
}
$("enter").onclick = () => { sessionStorage.setItem("jarvisToken", $("token").value.trim()); load().catch(() => {}); };
$("token").onkeydown = e => { if (e.key === "Enter") $("enter").click(); };
$("filter").oninput = render;
token() ? load().catch(() => {}) : showLogin();
</script>
</body>
</html>
