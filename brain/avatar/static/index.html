<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jarvis</title>
<style>
  html, body { margin: 0; height: 100%; background: #01050d; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/* Núcleo neural do Jarvis.
   Uma esfera de partículas ligadas como neurônios. Respira em repouso, se
   contrai e recebe ondas quando ouve, acende sinapses e acelera quando pensa,
   e a superfície vibra no volume real da voz quando fala.
   Eventos chegam do Jarvis por /events. ?demo=1 mostra uma demonstração. */
(() => {
'use strict';

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const bloom = document.createElement('canvas');
const bctx = bloom.getContext('2d');
let W = 0, H = 0, DPR = 1, bg = null, R = 200, cx = 0, cy = 0;

const params = new URLSearchParams(location.search);
const DEMO = params.has('demo') || location.protocol === 'file:';
const FREEZE = params.get('freeze');

const LABELS = { idle: 'ONLINE', listening: 'OUVINDO', thinking: 'PROCESSANDO', speaking: 'FALANDO', offline: 'SEM CONEXÃO' };

const state = {
  mode: DEMO ? 'idle' : 'offline',
  level: 0, envelope: null, frameMs: 40, speakStart: 0, text: '', hidden: false,
};
// intensidades suavizadas de cada modo (0 a 1), para transições sem saltos
const mix = { listening: 0, thinking: 0, speaking: 0, offline: DEMO ? 0 : 1 };

const smooth = t => { t = Math.max(0, Math.min(1, t)); return t * t * (3 - 2 * t); };
function rng(seed) { return () => (seed = (seed * 16807) % 2147483647) / 2147483647; }
const rand = rng(20261117);

// ------------------------------------------------------------- partículas
const N = 1500;
const BX = new Float32Array(N), BY = new Float32Array(N), BZ = new Float32Array(N);   // direção na esfera
const SX = new Float32Array(N), SY = new Float32Array(N), SZ = new Float32Array(N), SP = new Float32Array(N);
const SIZE = new Float32Array(N), PHASE = new Float32Array(N);
const golden = Math.PI * (3 - Math.sqrt(5));
for (let i = 0; i < N; i++) {
  const y = 1 - (i + 0.5) / N * 2, r = Math.sqrt(1 - y * y), th = golden * i;
  // leve desordem para não parecer uma grade perfeita
  let x = Math.cos(th) * r + (rand() - 0.5) * 0.05, z = Math.sin(th) * r + (rand() - 0.5) * 0.05, yy = y + (rand() - 0.5) * 0.05;
  const l = Math.hypot(x, yy, z);
  BX[i] = x / l; BY[i] = yy / l; BZ[i] = z / l;
  SIZE[i] = 0.6 + rand() * 1.1;
  PHASE[i] = rand() * Math.PI * 2;
}

// conexões: cada partícula se liga às duas vizinhas mais próximas
const edges = [];
{
  const cell = 0.12, grid = new Map(), key = (a, b, c) => `${a},${b},${c}`;
  for (let i = 0; i < N; i++) {
    const k = key(Math.floor(BX[i] / cell), Math.floor(BY[i] / cell), Math.floor(BZ[i] / cell));
    if (!grid.has(k)) grid.set(k, []);
    grid.get(k).push(i);
  }
  const seen = new Set();
  for (let i = 0; i < N; i++) {
    const gx = Math.floor(BX[i] / cell), gy = Math.floor(BY[i] / cell), gz = Math.floor(BZ[i] / cell);
    const near = [];
    for (let a = -1; a <= 1; a++) for (let b = -1; b <= 1; b++) for (let c = -1; c <= 1; c++) {
      const list = grid.get(key(gx + a, gy + b, gz + c));
      if (!list) continue;
      for (const j of list) if (j !== i) {
        const d = (BX[i] - BX[j]) ** 2 + (BY[i] - BY[j]) ** 2 + (BZ[i] - BZ[j]) ** 2;
        near.push([d, j]);
      }
    }
    near.sort((p, q) => p[0] - q[0]);
    for (let n = 0; n < Math.min(2, near.length); n++) {
      const j = near[n][1], id = i < j ? i * N + j : j * N + i;
      if (!seen.has(id)) { seen.add(id); edges.push(i, j); }
    }
  }
}
const E = edges.length / 2;

// filamentos internos: arcos que cruzam o núcleo (o "pensamento")
const FIL = 46;
const filaments = Array.from({ length: FIL }, () => {
  const a = Math.floor(rand() * N), b = Math.floor(rand() * N);
  return { a, b, bend: 0.15 + rand() * 0.45, speed: 0.4 + rand() * 1.2, offset: rand() * 10 };
});

// sinapses: pulsos que correm pelas conexões
const pulses = [];
function spawnPulse() { pulses.push({ e: Math.floor(rand() * E), t: 0, speed: 0.025 + rand() * 0.05, flip: rand() < 0.5 }); }

// anéis em órbita
const rings = [
  { tilt: 1.15, roll: 0.3, r: 1.42, n: 150, speed: 0.22, dash: 5 },
  { tilt: 1.75, roll: -0.6, r: 1.58, n: 180, speed: -0.15, dash: 9 },
  { tilt: 0.55, roll: 1.2, r: 1.30, n: 120, speed: 0.35, dash: 3 },
];

// ------------------------------------------------------------------ fundo
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  bloom.width = Math.ceil(W / 3); bloom.height = Math.ceil(H / 3);
  R = Math.min(W, H) * 0.27; cx = W / 2; cy = H * 0.46;
  buildBackground();
}

function buildBackground() {
  bg = document.createElement('canvas');
  bg.width = Math.round(W * DPR); bg.height = Math.round(H * DPR);
  const g = bg.getContext('2d');
  g.scale(DPR, DPR);
  const grad = g.createRadialGradient(cx, cy, 0, cx, cy, Math.max(W, H) * 0.8);
  grad.addColorStop(0, '#08254f'); grad.addColorStop(0.45, '#04142e'); grad.addColorStop(1, '#01040b');
  g.fillStyle = grad; g.fillRect(0, 0, W, H);
  g.strokeStyle = 'rgba(70,150,255,0.05)'; g.lineWidth = 1; g.beginPath();
  for (let x = (W / 2) % 36; x < W; x += 36) { g.moveTo(x, 0); g.lineTo(x, H); }
  for (let y = 0; y < H; y += 36) { g.moveTo(0, y); g.lineTo(W, y); }
  g.stroke();
  const r2 = rng(7);
  for (let i = 0; i < 12; i++) {
    const left = i % 2 === 0, pw = 60 + r2() * 70, ph = 34 + r2() * 60;
    const px = left ? 10 + r2() * W * 0.12 : W - 10 - pw - r2() * W * 0.12, py = 20 + r2() * (H - 80);
    g.strokeStyle = 'rgba(90,170,255,0.13)'; g.strokeRect(px, py, pw, ph);
    g.fillStyle = 'rgba(120,200,255,0.13)';
    for (let l = 0; l < ph / 7 - 1; l++) g.fillRect(px + 5, py + 6 + l * 7, (pw - 10) * (0.3 + r2() * 0.7), 2);
  }
  const vig = g.createRadialGradient(cx, cy, Math.min(W, H) * 0.3, cx, cy, Math.max(W, H) * 0.75);
  vig.addColorStop(0, 'rgba(0,0,0,0)'); vig.addColorStop(1, 'rgba(0,2,8,0.75)');
  g.fillStyle = vig; g.fillRect(0, 0, W, H);
}

// --------------------------------------------------------------- simulação
let rotY = 0, rotX = 0.35, spin = 0;

function field(x, y, z, t) {
  // "ruído" barato e contínuo: soma de ondas em 3D
  return Math.sin(3.1 * x + t * 0.9) * Math.sin(2.7 * y - t * 0.7) * Math.sin(2.9 * z + t * 0.6)
       + 0.5 * Math.sin(5.3 * x - 4.1 * z + t * 1.7) * Math.sin(4.7 * y + t * 1.3);
}

function update(now, dt) {
  const t = now * 0.001;
  for (const m of Object.keys(mix)) {
    const target = state.mode === m ? 1 : 0;
    mix[m] += (target - mix[m]) * Math.min(1, dt * 0.004);
  }
  spin += dt * 0.001 * (0.12 + 0.9 * mix.thinking + 0.25 * mix.speaking);
  rotY = spin;
  rotX = 0.35 + 0.12 * Math.sin(t * 0.3);
  const cyR = Math.cos(rotY), syR = Math.sin(rotY), cxR = Math.cos(rotX), sxR = Math.sin(rotX);

  const breath = 1 + 0.025 * Math.sin(t * 1.4);
  const lvl = state.level;
  const amp = 0.05 + 0.04 * mix.thinking + 0.30 * lvl * mix.speaking;
  const shrink = 1 - 0.07 * mix.listening;

  for (let i = 0; i < N; i++) {
    const x = BX[i], y = BY[i], z = BZ[i];
    let d = amp * field(x, y, z, t * (1 + mix.thinking * 1.5));
    // fala: anéis de onda saindo do equador
    d += 0.18 * lvl * mix.speaking * Math.sin(10 * Math.abs(y) - t * 14);
    // ouvir: ondas vindo de fora para dentro
    d += 0.05 * mix.listening * Math.sin(12 * Math.abs(y) + t * 9);
    const r = (breath + d) * shrink;
    // rotação
    const x1 = x * cyR + z * syR, z1 = -x * syR + z * cyR;
    const y2 = y * cxR - z1 * sxR, z2 = y * sxR + z1 * cxR;
    const px = x1 * r, py = y2 * r, pz = z2 * r;
    const p = 4.2 / (4.2 - pz);
    SX[i] = cx + px * R * p; SY[i] = cy + py * R * p; SZ[i] = pz; SP[i] = p;
  }

  const rate = 0.15 + 2.5 * mix.thinking + 1.2 * lvl * mix.speaking + 0.4 * mix.listening;
  for (let k = 0; k < rate * dt / 16; k++) if (pulses.length < 400) spawnPulse();
  for (let k = pulses.length - 1; k >= 0; k--) {
    pulses[k].t += pulses[k].speed * dt / 16;
    if (pulses[k].t >= 1) pulses.splice(k, 1);
  }
}

// ---------------------------------------------------------------- desenho
const NB = 6;
const buckets = Array.from({ length: NB }, () => []);

function depthAlpha(z) { return smooth((z + 1.25) / 2.5); }   // trás apagado, frente acesa

function drawEdges(glow) {
  for (const b of buckets) b.length = 0;
  for (let k = 0; k < E; k++) {
    const i = edges[2 * k], j = edges[2 * k + 1];
    const a = depthAlpha((SZ[i] + SZ[j]) / 2);
    const q = Math.min(NB - 1, Math.floor(a * NB));
    buckets[q].push(SX[i], SY[i], SX[j], SY[j]);
  }
  ctx.lineWidth = 0.8;
  for (let q = 0; q < NB; q++) {
    const b = buckets[q]; if (!b.length) continue;
    const u = q / (NB - 1);
    ctx.strokeStyle = `rgba(${60 + 80 * u | 0},${150 + 80 * u | 0},255,${((0.04 + 0.30 * u) * glow).toFixed(3)})`;
    ctx.beginPath();
    for (let i = 0; i < b.length; i += 4) { ctx.moveTo(b[i], b[i + 1]); ctx.lineTo(b[i + 2], b[i + 3]); }
    ctx.stroke();
  }
}

function drawParticles(now, glow) {
  for (let i = 0; i < N; i++) {
    const a = depthAlpha(SZ[i]);
    const tw = 0.65 + 0.35 * Math.sin(now * 0.003 + PHASE[i]);
    const al = (0.10 + 0.85 * a) * tw * glow;
    if (al < 0.03) continue;
    const s = SIZE[i] * SP[i] * (0.8 + 0.6 * a);
    ctx.fillStyle = `rgba(${150 + 105 * a | 0},${215 + 40 * a | 0},255,${al.toFixed(3)})`;
    ctx.fillRect(SX[i] - s / 2, SY[i] - s / 2, s, s);
  }
}

function drawFilaments(now, glow) {
  const t = now * 0.001, strength = 0.12 + 0.75 * mix.thinking + 0.4 * state.level * mix.speaking;
  ctx.lineWidth = 1.1;
  for (const f of filaments) {
    const flick = 0.5 + 0.5 * Math.sin(t * f.speed * 3 + f.offset);
    const al = strength * flick * glow * 0.55;
    if (al < 0.02) continue;
    const ax = SX[f.a], ay = SY[f.a], bx = SX[f.b], by = SY[f.b];
    // ponto de controle puxado para o centro: o arco atravessa o núcleo
    const mx = (ax + bx) / 2, my = (ay + by) / 2;
    const qx = mx + (cx - mx) * (1 - f.bend), qy = my + (cy - my) * (1 - f.bend);
    ctx.strokeStyle = `rgba(140,220,255,${al.toFixed(3)})`;
    ctx.beginPath(); ctx.moveTo(ax, ay); ctx.quadraticCurveTo(qx, qy, bx, by); ctx.stroke();
  }
}

function drawPulses(glow) {
  for (const p of pulses) {
    let i = edges[2 * p.e], j = edges[2 * p.e + 1];
    if (p.flip) { const tmp = i; i = j; j = tmp; }
    const x = SX[i] + (SX[j] - SX[i]) * p.t, y = SY[i] + (SY[j] - SY[i]) * p.t;
    const a = depthAlpha((SZ[i] + SZ[j]) / 2), fade = Math.sin(p.t * Math.PI);
    const r = 2.6 * a + 0.8;
    const g = ctx.createRadialGradient(x, y, 0, x, y, r * 3);
    g.addColorStop(0, `rgba(255,255,255,${(0.95 * a * fade * glow).toFixed(3)})`);
    g.addColorStop(1, 'rgba(80,190,255,0)');
    ctx.fillStyle = g; ctx.fillRect(x - r * 3, y - r * 3, r * 6, r * 6);
  }
}

function drawCore(now, glow) {
  const t = now * 0.001, lvl = state.level;
  const pulse = 0.55 + 0.15 * Math.sin(t * 2.2) + 0.35 * mix.thinking * (0.5 + 0.5 * Math.sin(t * 9)) + 0.9 * lvl * mix.speaking;
  const r = R * (0.42 + 0.12 * lvl * mix.speaking);
  const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
  g.addColorStop(0, `rgba(235,250,255,${Math.min(1, 0.75 * pulse * glow).toFixed(3)})`);
  g.addColorStop(0.18, `rgba(120,215,255,${Math.min(1, 0.55 * pulse * glow).toFixed(3)})`);
  g.addColorStop(0.55, `rgba(40,120,255,${(0.16 * pulse * glow).toFixed(3)})`);
  g.addColorStop(1, 'rgba(20,60,200,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7); ctx.fill();
  const h = ctx.createRadialGradient(cx, cy, R * 0.6, cx, cy, R * 1.5);
  h.addColorStop(0, `rgba(60,150,255,${(0.10 * glow).toFixed(3)})`); h.addColorStop(1, 'rgba(40,100,255,0)');
  ctx.fillStyle = h; ctx.beginPath(); ctx.arc(cx, cy, R * 1.5, 0, 7); ctx.fill();
}

function drawRings(now, glow) {
  const t = now * 0.001;
  for (const ring of rings) {
    const sp = ring.speed * (1 + 2.5 * mix.thinking);
    const ct = Math.cos(ring.tilt), st = Math.sin(ring.tilt), cr = Math.cos(ring.roll + spin * 0.3), sr = Math.sin(ring.roll + spin * 0.3);
    for (let k = 0; k < ring.n; k++) {
      if (Math.floor(k / ring.dash) % 2) continue;
      const a = k / ring.n * Math.PI * 2 + t * sp;
      let x = Math.cos(a) * ring.r, y = 0, z = Math.sin(a) * ring.r;
      const y1 = y * ct - z * st, z1 = y * st + z * ct;
      const x2 = x * cr - y1 * sr, y2 = x * sr + y1 * cr;
      const p = 4.2 / (4.2 - z1);
      const al = (0.12 + 0.55 * smooth((z1 + 1.6) / 3.2)) * glow;
      ctx.fillStyle = `rgba(120,205,255,${al.toFixed(3)})`;
      const s = 1.6 * p;
      ctx.fillRect(cx + x2 * R * p - s / 2, cy + y2 * R * p - s / 2, s, s);
    }
  }
  if (mix.listening > 0.02) {                       // ondas de escuta se fechando
    for (let i = 0; i < 3; i++) {
      const u = 1 - ((t * 0.7) + i / 3) % 1;
      ctx.lineWidth = 1.5; ctx.strokeStyle = `rgba(130,215,255,${(0.45 * mix.listening * (1 - u)).toFixed(3)})`;
      ctx.beginPath(); ctx.arc(cx, cy, R * (1.05 + u * 0.9), 0, 7); ctx.stroke();
    }
  }
}

// --------------------------------------------------------------------- HUD
function arc(x, y, r, a0, a1, w, al) { ctx.lineWidth = w; ctx.strokeStyle = `rgba(110,200,255,${al})`; ctx.beginPath(); ctx.arc(x, y, r, a0, a1); ctx.stroke(); }

function drawFrame(now) {
  const t = now * 0.0002 * (1 + 4 * mix.thinking);
  arc(cx, cy, R * 1.82, 0, 7, 1, 0.12);
  for (let i = 0; i < 3; i++) arc(cx, cy, R * 1.9, t + i * 2.1, t + i * 2.1 + 1.0, 2.2, 0.28);
  ctx.strokeStyle = 'rgba(110,200,255,0.18)'; ctx.lineWidth = 1; ctx.beginPath();
  for (let i = 0; i < 90; i++) {
    const a = i * Math.PI / 45 - t * 0.6, r0 = R * 1.72, r1 = R * (i % 5 ? 1.75 : 1.79);
    ctx.moveTo(cx + Math.cos(a) * r0, cy + Math.sin(a) * r0); ctx.lineTo(cx + Math.cos(a) * r1, cy + Math.sin(a) * r1);
  }
  ctx.stroke();
}

function drawBadge(now) {
  const r = Math.max(34, Math.min(W, H) * 0.07), x = W - r - 26, y = r + 26;
  ctx.fillStyle = 'rgba(8,40,90,0.55)'; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
  arc(x, y, r, 0, 7, 1.5, 0.8);
  arc(x, y, r * 0.84, now * 0.0012, now * 0.0012 + 4.2, 3, 0.55);
  ctx.fillStyle = 'rgba(215,245,255,0.95)';
  ctx.font = `600 ${Math.round(r * 0.3)}px "Segoe UI", system-ui, sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  if ('letterSpacing' in ctx) ctx.letterSpacing = '2px';
  ctx.fillText('JARVIS', x + 1, y);
  if ('letterSpacing' in ctx) ctx.letterSpacing = '0px';
}

const bars = new Float32Array(48);
function drawStatus(now) {
  const color = state.mode === 'offline' ? '255,140,120' : '150,225,255';
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.font = '600 13px "Segoe UI", system-ui, sans-serif';
  if ('letterSpacing' in ctx) ctx.letterSpacing = '3px';
  const blink = state.mode === 'idle' ? 1 : 0.55 + 0.45 * Math.sin(now * 0.008);
  ctx.fillStyle = `rgba(${color},${blink})`; ctx.beginPath(); ctx.arc(30, 38, 4, 0, 7); ctx.fill();
  ctx.fillStyle = `rgba(${color},0.9)`; ctx.fillText(LABELS[state.mode] || '', 44, 43);
  if ('letterSpacing' in ctx) ctx.letterSpacing = '0px';

  const bw = Math.min(5, W / 140), gap = bw * 0.7, total = bars.length * (bw + gap), x0 = cx - total / 2, yb = H - 26;
  for (let i = 0; i < bars.length; i++) {
    const mid = 1 - Math.abs(i - bars.length / 2) / (bars.length / 2);
    const target = state.level * (0.3 + 0.7 * mid) * (0.45 + 0.55 * Math.abs(Math.sin(now * 0.013 + i * 1.7)));
    bars[i] += (target - bars[i]) * 0.35;
    const h = 2 + bars[i] * 46;
    ctx.fillStyle = `rgba(120,210,255,${0.35 + 0.6 * bars[i]})`;
    ctx.fillRect(x0 + i * (bw + gap), yb - h, bw, h);
  }

  if (state.mode === 'speaking' && state.text) {
    const total = state.envelope ? state.envelope.length * state.frameMs : state.text.length * 62;
    const shown = Math.ceil(state.text.length * Math.min(1, (performance.now() - state.speakStart) / total + 0.05));
    let line = state.text.slice(0, shown);
    ctx.font = '400 16px "Segoe UI", system-ui, sans-serif'; ctx.textAlign = 'center';
    const max = Math.min(W - 60, 720);
    while (ctx.measureText(line).width > max && line.includes(' ')) line = line.slice(line.indexOf(' ') + 1);
    const tw = ctx.measureText(line).width;
    ctx.fillStyle = 'rgba(2,12,30,0.62)'; ctx.fillRect(cx - tw / 2 - 14, H - 109, tw + 28, 30);
    ctx.fillStyle = 'rgba(225,245,255,0.95)'; ctx.fillText(line, cx, H - 88);
  }
}

function drawStandby() {
  ctx.fillStyle = '#01050d'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(110,190,255,0.35)';
  ctx.font = '600 13px "Segoe UI", system-ui, sans-serif'; ctx.textAlign = 'center';
  ctx.fillText('JARVIS · AVATAR OCULTO', cx, H / 2);
}

// --------------------------------------------------------------- animação
function mouthTarget(now) {
  if (state.mode !== 'speaking') return 0;
  if (state.envelope && state.envelope.length) {
    const f = (now - state.speakStart) / state.frameMs;
    if (f < 0) return 0;
    const i = Math.floor(f), e = state.envelope;
    if (i >= e.length - 1) return 0;
    return e[i] + (e[i + 1] - e[i]) * (f - i);
  }
  const s = now * 0.001;
  return Math.max(0, 0.42 + 0.34 * Math.sin(s * 11.3) * Math.sin(s * 6.7) + 0.2 * Math.sin(s * 23.1));
}

let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(50, now - last); last = now;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (state.hidden) { drawStandby(); return; }
  if (DEMO) demoTick(now);

  const target = Math.min(1, mouthTarget(now));
  state.level += (target - state.level) * (target > state.level ? 0.55 : 0.25);
  update(now, dt);

  const glow = (Math.random() < 0.01 ? 0.8 : 1) * (1 - 0.6 * mix.offline);
  ctx.globalCompositeOperation = 'source-over';
  ctx.drawImage(bg, 0, 0, W, H);
  ctx.globalCompositeOperation = 'lighter';
  drawFrame(now);
  drawCore(now, glow);
  drawFilaments(now, glow);
  drawEdges(glow);
  drawParticles(now, glow);
  drawPulses(glow);
  drawRings(now, glow);

  bctx.globalCompositeOperation = 'copy';
  bctx.drawImage(cv, 0, 0, bloom.width, bloom.height);
  ctx.save(); ctx.filter = 'blur(8px)'; ctx.globalAlpha = 0.6; ctx.drawImage(bloom, 0, 0, W, H); ctx.restore();

  ctx.globalCompositeOperation = 'source-over';
  drawBadge(now);
  drawStatus(now);
}

// --------------------------------------------------------- ligação ao Jarvis
function apply(msg) {
  switch (msg.type) {
    case 'state':
      if (state.mode === 'speaking' && msg.mode !== 'speaking') state.envelope = null;
      state.mode = msg.mode; break;
    case 'speak':
      state.mode = 'speaking';
      state.envelope = msg.envelope && msg.envelope.length ? msg.envelope : null;
      state.frameMs = msg.frame_ms || 40;
      state.speakStart = performance.now() + (msg.delay_ms || 0);
      state.text = msg.text || ''; break;
    case 'stop': state.mode = msg.mode || 'idle'; state.envelope = null; state.text = ''; break;
    case 'show': state.hidden = false; break;
    case 'hide': window.close(); setTimeout(() => { state.hidden = true; }, 250); break;
  }
}

function connect() {
  const es = new EventSource('/events');
  es.onopen = () => { if (state.mode === 'offline') state.mode = 'idle'; };
  es.onmessage = ev => { try { apply(JSON.parse(ev.data)); } catch (e) { console.error(e); } };
  es.onerror = () => { state.mode = 'offline'; state.envelope = null; };
  // sinal de vida: é assim que o Jarvis sabe que esta janela continua aberta
  setInterval(() => { fetch('/alive').catch(() => {}); }, 1500);
}

let demoStep = -1;
function demoTick(now) {
  if (FREEZE) {
    if (demoStep < 0) {
      demoStep = 0; state.mode = FREEZE; for (const m of Object.keys(mix)) mix[m] = m === FREEZE ? 1 : 0;
      state.text = 'Bom dia, Pedro. Todos os sistemas estão online.'; state.speakStart = now - 1500;
    }
    if (FREEZE === 'speaking') state.envelope = Array(400).fill(0.75);
    return;
  }
  const step = Math.floor(now / 1000) % 14;
  if (step === demoStep) return;
  demoStep = step;
  if (step === 0) apply({ type: 'state', mode: 'idle' });
  if (step === 2) apply({ type: 'state', mode: 'listening' });
  if (step === 5) apply({ type: 'state', mode: 'thinking' });
  if (step === 8) {
    const env = Array.from({ length: 130 }, (_, i) => Math.max(0, Math.sin(i * 0.9) * Math.sin(i * 0.23) * 0.9 + 0.25));
    apply({ type: 'speak', envelope: env, frame_ms: 40, text: 'Bom dia, Pedro. Todos os sistemas estão online.' });
  }
  if (step === 13) apply({ type: 'stop' });
}

window.addEventListener('resize', resize);
resize();
if (!DEMO) connect();
requestAnimationFrame(frame);
})();
</script>
