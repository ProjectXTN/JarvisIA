# Só a API de texto (veja o Dockerfile). Defina SECRET_TOKEN_JARVIS no .env.
services:
  jarvis-api:
    build: .
    container_name: jarvis-api
    env_file: .env
    environment:
      - OLLAMA_HOST=http://host.docker.internal:11500
      - JARVIS_API_HOST=0.0.0.0
    ports:
      - "127.0.0.1:11600:11600"
    extra_hosts:
      - "host.docker.internal:host-gateway"
